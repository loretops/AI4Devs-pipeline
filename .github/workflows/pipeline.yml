name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - '**'
      - '!main'  # Excluyendo la rama principal
    paths:
      - 'backend/**'  # Solo ejecutar cuando hay cambios en el backend

jobs:
  test:
    name: Run Backend Tests
    # Este job se ejecutará cuando hay un push a una rama con un PR abierto
    if: github.event.pull_request || github.head_ref
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Run tests
        working-directory: backend
        run: npm test

  build:
    name: Build Backend
    needs: test
    # Este job se ejecutará si los tests fueron exitosos
    if: success()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Build backend
        working-directory: backend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: backend/dist

